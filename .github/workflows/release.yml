name: Packages
run-name: Packages v${{ inputs.version }} from ${{ github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version without v (for example, 1.2.3 or 1.2.3-rc.1)'
        required: true
        type: string
      draft:
        description: If creating a release, save it as a draft
        type: boolean
        default: false
      create_release:
        description: Also attach all verified packages to a GitHub release
        type: boolean
        default: false
      publish_nuget:
        description: Also publish AurorisNet.Pressroom.Client to NuGet.org
        type: boolean
        default: false
      prerelease:
        description: If creating a release, mark it as a prerelease (automatic for suffixed versions)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

env:
  RELEASE_VERSION: ${{ inputs.version }}
  CREATE_RELEASE: ${{ inputs.create_release }}

defaults:
  run:
    shell: pwsh

jobs:
  validate:
    name: Validate package inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      playwright: ${{ steps.versions.outputs.playwright }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate the version
        id: versions
        run: |
          $number = '(0|[1-9][0-9]*)'
          $identifier = '(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)'
          $pattern = "\A$number\.$number\.$number(?:-$identifier(?:\.$identifier)*)?\z"
          if ($env:RELEASE_VERSION -cnotmatch $pattern) {
            throw 'Use a version such as 1.2.3 or 1.2.3-rc.1, without a v prefix or build metadata.'
          }
          foreach ($part in ($env:RELEASE_VERSION.Split('-')[0].Split('.'))) {
            if ([long]$part -gt 65534) { throw 'Version components must be at most 65534 for .NET assembly versions.' }
          }
          $existingTag = git tag --list "v$env:RELEASE_VERSION"
          if ($LASTEXITCODE -ne 0) { throw 'Could not inspect repository tags.' }
          if ($env:CREATE_RELEASE -eq 'true' -and $existingTag) { throw 'This version already has a tag. Choose a new release version.' }
          # Both installers use the checked-in PressroomPlaywrightVersion and lock files, never a
          # newer NuGet release, so one release carries one Chromium and rebuilds from the commit.
          $playwright = ./build/Resolve-PlaywrightVersion.ps1 -Version pinned
          "playwright=$playwright" >> $env:GITHUB_OUTPUT
      - name: Validate NuGet publishing configuration
        if: ${{ inputs.publish_nuget }}
        env:
          NUGET_USER: ${{ vars.NUGET_USER }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:NUGET_USER)) {
            throw 'Set the NUGET_USER repository variable to your NuGet.org profile username and configure Trusted Publishing before selecting publish_nuget.'
          }

  build:
    name: Package Windows x64 for IIS
    needs: validate
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      PLAYWRIGHT_VERSION: ${{ needs.validate.outputs.playwright }}
      # Cache only this workflow's dependencies, not the runner's preinstalled packages.
      NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
    steps:
      - name: Check out the selected commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            10.0.x
            8.0.x
          cache: true
          cache-dependency-path: |
            src/**/packages.lock.json
            tests/**/packages.lock.json

      - name: Restore locked dependencies
        run: dotnet restore Pressroom.slnx --locked-mode "-p:Version=$env:RELEASE_VERSION" -p:DisableImplicitNuGetFallbackFolder=true

      - name: Build
        run: dotnet build Pressroom.slnx -c Release --no-restore "-p:Version=$env:RELEASE_VERSION" -p:ContinuousIntegrationBuild=true

      - name: Run tests
        run: dotnet test --solution Pressroom.slnx -c Release --no-build --no-restore

      - name: Publish and verify the framework-dependent package
        run: |
          dotnet publish src/Pressroom.Server/Pressroom.Server.csproj -c Release --no-restore `
            -p:PublishProfile=IisFolder "-p:Version=$env:RELEASE_VERSION" `
            -p:ContinuousIntegrationBuild=true
          if ($LASTEXITCODE -ne 0) { throw 'Publish failed for IisFolder.' }
          $manifest = Get-Content artifacts/publish/IisFolder/release-manifest.json -Raw | ConvertFrom-Json
          if ($manifest.playwrightVersion -ne $env:PLAYWRIGHT_VERSION) { throw "Expected pinned Playwright $env:PLAYWRIGHT_VERSION; packaged $($manifest.playwrightVersion)." }
          ./build/Package-Pressroom.ps1 -PublishDirectory artifacts/publish/IisFolder `
            -OutputDirectory artifacts/release -Version $env:RELEASE_VERSION -Variant framework-dependent

      - name: Preserve release assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-install-packages
          path: artifacts/release/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
          overwrite: true

      - name: Test the packaged Windows browser
        env:
          PRESSROOM_RUN_BROWSER_TESTS: '1'
          PRESSROOM_TEST_SANDBOX: 'true'
          PRESSROOM_TEST_BROWSERS_PATH: ${{ github.workspace }}/artifacts/publish/IisFolder/browsers
        run: |
          dotnet test --project tests/Pressroom.Rendering.Tests -c Release --no-build --no-restore
          if ($LASTEXITCODE -ne 0) { throw 'Windows browser tests failed.' }
          dotnet test --project tests/Pressroom.Server.Tests -c Release --no-build --no-restore
          if ($LASTEXITCODE -ne 0) { throw 'Windows jobs browser tests failed.' }

  client:
    name: Package the .NET client with bundled contracts
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            10.0.x
            8.0.x
      - name: Restore, build, and test both client targets
        run: |
          dotnet restore tests/Pressroom.Contracts.Tests --locked-mode "-p:Version=$env:RELEASE_VERSION"
          if ($LASTEXITCODE -ne 0) { throw 'Client restore failed.' }
          dotnet build tests/Pressroom.Contracts.Tests -c Release --no-restore "-p:Version=$env:RELEASE_VERSION" -p:ContinuousIntegrationBuild=true
          if ($LASTEXITCODE -ne 0) { throw 'Client build failed.' }
          dotnet test --project tests/Pressroom.Contracts.Tests -c Release --no-build --no-restore
          if ($LASTEXITCODE -ne 0) { throw 'Client tests failed.' }
      - name: Pack
        run: |
          dotnet pack src/Pressroom.Client -c Release --no-build --no-restore -o artifacts/nuget "-p:Version=$env:RELEASE_VERSION" -p:ContinuousIntegrationBuild=true
          if ($LASTEXITCODE -ne 0) { throw 'Client pack failed.' }
      - name: Verify fresh consumers and checksum the packages
        run: |
          ./build/Test-ClientPackages.ps1 -BuildOnly -Feed artifacts/nuget -Version $env:RELEASE_VERSION
          foreach ($file in Get-ChildItem artifacts/nuget -File -Include *.nupkg,*.snupkg -Recurse) {
            $hash = (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            [IO.File]::WriteAllText($file.FullName + '.sha256', "$hash  $($file.Name)`n", [Text.UTF8Encoding]::new($false))
          }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nuget-packages
          path: artifacts/nuget/*
          if-no-files-found: error
          retention-days: 14

  linux:
    name: Package Linux x64 for local installation
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PLAYWRIGHT_VERSION: ${{ needs.validate.outputs.playwright }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare optional isolation on this disposable test host
        shell: bash
        run: |
          docker network create --driver bridge --opt com.docker.network.bridge.name=pressroom0 --opt com.docker.network.bridge.enable_icc=false pressroom-egress-blocked
          sudo iptables -I DOCKER-USER 1 -i pressroom0 -m conntrack ! --ctstate ESTABLISHED,RELATED -j DROP
          sudo iptables -I INPUT 1 -i pressroom0 -m conntrack ! --ctstate ESTABLISHED,RELATED -j DROP
          sudo ip6tables -I FORWARD 1 -i pressroom0 -m conntrack ! --ctstate ESTABLISHED,RELATED -j DROP
          sudo ip6tables -I INPUT 1 -i pressroom0 -m conntrack ! --ctstate ESTABLISHED,RELATED -j DROP
      - name: Build and verify as an unprivileged user
        # The runtime smoke check uses the same outbound firewall as deployment.
        # The builder itself needs network access to restore pinned dependencies.
        # 'pinned' restores the checked-in lock files without a refresh, matching the Windows package.
        run: |
          ./build/Build-Container.ps1 -Version $env:RELEASE_VERSION -Image "ghcr.io/auroris/pressroom:$env:RELEASE_VERSION" -PlaywrightVersion pinned -TestNetworkIsolation
          $manifest = Get-Content artifacts/container-publish/release-manifest.json -Raw | ConvertFrom-Json
          if ($manifest.playwrightVersion -ne $env:PLAYWRIGHT_VERSION) { throw "Expected pinned Playwright $env:PLAYWRIGHT_VERSION; packaged $($manifest.playwrightVersion)." }
      - name: Package the verified Linux folder
        run: |
          ./build/Package-Pressroom.ps1 -PublishDirectory artifacts/container-publish -OutputDirectory artifacts/linux-release -Version $env:RELEASE_VERSION -Variant framework-dependent -RuntimeIdentifier linux-x64
      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ghcr.io/auroris/pressroom:${{ inputs.version }}
          format: spdx-json
          output-file: artifacts/linux-release/pressroom.spdx.json
          upload-release-assets: false
      - name: Reject critical vulnerabilities
        uses: aquasecurity/trivy-action@8f28faec26515256b6d22074d1d2a8986f4cbd87
        with:
          image-ref: ghcr.io/auroris/pressroom:${{ inputs.version }}
          severity: CRITICAL
          exit-code: '1'
          format: table
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-install-packages
          path: artifacts/linux-release/*
          if-no-files-found: error
          retention-days: 14

  publish-nuget:
    name: Publish the .NET client to NuGet.org
    needs: [validate, build, client, linux]
    if: ${{ inputs.publish_nuget }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      id-token: write
    steps:
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - name: Download the verified client package and symbols
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download $env:GITHUB_RUN_ID --repo $env:GITHUB_REPOSITORY --name nuget-packages --dir artifacts/nuget
          if ($LASTEXITCODE -ne 0) { throw 'Could not download the client package.' }
          foreach ($extension in @('nupkg', 'snupkg')) {
            $name = "AurorisNet.Pressroom.Client.$env:RELEASE_VERSION.$extension"
            $path = Join-Path artifacts/nuget $name
            $actual = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
            if ((Get-Content -LiteralPath "$path.sha256" -Raw).Trim() -cne "$actual  $name") {
              throw "Checksum mismatch for $name."
            }
          }
      - name: Log in to NuGet.org with Trusted Publishing
        id: nuget_login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ vars.NUGET_USER }}
      - name: Push the client package and symbols
        env:
          NUGET_API_KEY: ${{ steps.nuget_login.outputs.NUGET_API_KEY }}
          NUGET_SYMBOL_API_KEY: ${{ steps.nuget_login.outputs.NUGET_API_KEY }}
        run: |
          # NuGet also pushes the matching .snupkg beside this package.
          dotnet nuget push "artifacts/nuget/AurorisNet.Pressroom.Client.$env:RELEASE_VERSION.nupkg" --source https://api.nuget.org/v3/index.json
          if ($LASTEXITCODE -ne 0) { throw 'NuGet.org publication failed. Inspect the package and symbols before retrying.' }
          "Published AurorisNet.Pressroom.Client $env:RELEASE_VERSION and symbols to NuGet.org." >> $env:GITHUB_STEP_SUMMARY

  release:
    name: Attach all packages to a GitHub release
    needs: [validate, build, client, linux]
    if: ${{ inputs.create_release }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download the verified packages from this run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          foreach ($artifact in @('windows-install-packages', 'nuget-packages', 'linux-install-packages')) {
            gh run download $env:GITHUB_RUN_ID --repo $env:GITHUB_REPOSITORY --name $artifact --dir artifacts/release
            if ($LASTEXITCODE -ne 0) { throw "Could not download $artifact." }
          }
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_DRAFT: ${{ inputs.draft }}
          RELEASE_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          $tag = "v$env:RELEASE_VERSION"
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github+json' }
          # Recheck immediately before publishing; never reuse or move an existing tag/release.
          foreach ($resource in @("git/ref/tags/$tag", "releases/tags/$tag")) {
            $response = Invoke-WebRequest -Uri "$env:GITHUB_API_URL/repos/$env:GITHUB_REPOSITORY/$resource" `
              -Headers $headers -SkipHttpErrorCheck
            if ($response.StatusCode -ne 404) {
              throw "Expected an unused release version; GitHub returned HTTP $($response.StatusCode) for $resource."
            }
          }

          $checksums = @(Get-ChildItem artifacts/release -Filter '*.sha256' -File)
          if ($checksums.Count -ne 4) { throw 'Expected checksums for both installers, the client NuGet package, and its symbols.' }
          foreach ($checksum in $checksums) {
            $name = $checksum.Name.Substring(0, $checksum.Name.Length - '.sha256'.Length)
            $archive = Join-Path artifacts/release $name
            $actual = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
            if ((Get-Content $checksum.FullName -Raw).Trim() -cne "$actual  $name") { throw "Checksum mismatch for $name." }
          }
          $assets = @(Get-ChildItem artifacts/release -File | ForEach-Object FullName)
          $notes = @"
          Pressroom $env:RELEASE_VERSION, built from commit $env:GITHUB_SHA.

          - Windows x64 framework-dependent ZIP for IIS or local hosting. Requires .NET 10 and the Hosting Bundle for IIS.
          - Linux x64 framework-dependent tarball. Requires the .NET 10 ASP.NET Core runtime and the documented native libraries, fonts and sandbox policy. Run under an unprivileged user; Docker is not required on the deployment host.
          - AurorisNet.Pressroom.Client NuGet package and symbols for .NET 8 and .NET 10, including the contracts assembly.

          The server packages differ because they contain platform-specific apphosts, private Node/Playwright drivers and Chromium. Each includes fonts, deployment documentation, and a file-hash manifest. Keep configuration outside the extracted release directory and verify the accompanying SHA-256 files.

          The builds passed tests and sandboxed PDF warm-up. Target-server IIS/Linux acceptance remains a deployment check; see the acceptance guides in each package. The Linux SBOM describes the container used to verify its payload. Container image publishing is a separate manual workflow.
          "@
          $notesPath = Join-Path $env:RUNNER_TEMP 'pressroom-release-notes.md'
          Set-Content -LiteralPath $notesPath -Value $notes -Encoding utf8
          # Creating the ref is atomic: a concurrent tag creation fails instead of
          # letting gh attach these binaries to a different existing commit.
          $tagBody = @{ ref = "refs/tags/$tag"; sha = $env:GITHUB_SHA } | ConvertTo-Json
          Invoke-RestMethod -Method Post -Uri "$env:GITHUB_API_URL/repos/$env:GITHUB_REPOSITORY/git/refs" `
            -Headers $headers -ContentType 'application/json' -Body $tagBody | Out-Null
          $arguments = @('release', 'create', $tag) + $assets + @(
            '--repo', $env:GITHUB_REPOSITORY, '--verify-tag',
            '--title', "Pressroom $env:RELEASE_VERSION", '--notes-file', $notesPath, '--generate-notes'
          )
          if ($env:RELEASE_DRAFT -eq 'true') { $arguments += '--draft' }
          if ($env:RELEASE_PRERELEASE -eq 'true' -or $env:RELEASE_VERSION.Contains('-')) { $arguments += '--prerelease' }
          gh @arguments
          if ($LASTEXITCODE -ne 0) { throw 'GitHub release creation failed. The verified assets remain in this workflow run.' }
          "Created release $tag from commit $env:GITHUB_SHA with Windows and Linux installers, client NuGet packages, symbols, and SHA-256 files." >> $env:GITHUB_STEP_SUMMARY
