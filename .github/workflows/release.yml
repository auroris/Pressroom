name: Release
run-name: Release v${{ inputs.version }} from ${{ github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version without v (for example, 1.2.3 or 1.2.3-rc.1)'
        required: true
        type: string
      draft:
        description: Save as a draft instead of publishing immediately
        type: boolean
        default: false
      prerelease:
        description: Mark as a prerelease (automatic for versions with a suffix)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

env:
  RELEASE_VERSION: ${{ inputs.version }}

defaults:
  run:
    shell: pwsh

jobs:
  build:
    name: Test and package Windows x64
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - name: Check out the selected commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate the version
        run: |
          $number = '(0|[1-9][0-9]*)'
          $identifier = '(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)'
          $pattern = "\A$number\.$number\.$number(?:-$identifier(?:\.$identifier)*)?\z"
          if ($env:RELEASE_VERSION -cnotmatch $pattern) {
            throw 'Use a version such as 1.2.3 or 1.2.3-rc.1, without a v prefix or build metadata.'
          }
          foreach ($part in ($env:RELEASE_VERSION.Split('-')[0].Split('.'))) {
            if ([long]$part -gt 65534) { throw 'Version components must be at most 65534 for .NET assembly versions.' }
          }
          $existingTag = git tag --list "v$env:RELEASE_VERSION"
          if ($LASTEXITCODE -ne 0) { throw 'Could not inspect repository tags.' }
          if ($existingTag) { throw 'This version already has a tag. Choose a new release version.' }

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore locked dependencies
        run: dotnet restore Pressroom.slnx --locked-mode "-p:Version=$env:RELEASE_VERSION"

      - name: Build
        run: dotnet build Pressroom.slnx -c Release --no-restore "-p:Version=$env:RELEASE_VERSION" -p:ContinuousIntegrationBuild=true

      - name: Run tests
        run: dotnet test --solution Pressroom.slnx -c Release --no-build --no-restore

      - name: Publish and verify both deployment packages
        run: |
          $packages = @(
            @{ Profile = 'IisFolder'; Variant = 'framework-dependent' },
            @{ Profile = 'IisFolderSelfContained'; Variant = 'self-contained' }
          )
          foreach ($package in $packages) {
            dotnet publish src/Pressroom.Server/Pressroom.Server.csproj -c Release `
              "-p:PublishProfile=$($package.Profile)" "-p:Version=$env:RELEASE_VERSION" `
              -p:ContinuousIntegrationBuild=true
            if ($LASTEXITCODE -ne 0) { throw "Publish failed for $($package.Profile)." }
            ./build/Package-Pressroom.ps1 -PublishDirectory "artifacts/publish/$($package.Profile)" `
              -OutputDirectory artifacts/release -Version $env:RELEASE_VERSION -Variant $package.Variant
          }

      - name: Preserve release assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-packages
          path: artifacts/release/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
          overwrite: true

  release:
    name: Create GitHub release
    needs: build
    runs-on: windows-2025
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download verified packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-packages
          path: release-assets

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_DRAFT: ${{ inputs.draft }}
          RELEASE_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          $tag = "v$env:RELEASE_VERSION"
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github+json' }
          # Recheck immediately before publishing; never reuse or move an existing tag/release.
          foreach ($resource in @("git/ref/tags/$tag", "releases/tags/$tag")) {
            $response = Invoke-WebRequest -Uri "$env:GITHUB_API_URL/repos/$env:GITHUB_REPOSITORY/$resource" `
              -Headers $headers -SkipHttpErrorCheck
            if ($response.StatusCode -ne 404) {
              throw "Expected an unused release version; GitHub returned HTTP $($response.StatusCode) for $resource."
            }
          }

          $assets = @()
          foreach ($variant in @('framework-dependent', 'self-contained')) {
            $name = "Pressroom-$env:RELEASE_VERSION-win-x64-$variant.zip"
            $archive = Join-Path release-assets $name
            $checksum = $archive + '.sha256'
            $expected = (Get-Content -LiteralPath $checksum -Raw).Trim()
            $actual = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($expected -cne "$actual  $name") { throw "Checksum mismatch for $name." }
            $assets += $archive, $checksum
          }

          $notes = @"
          Windows x64 packages for Pressroom $env:RELEASE_VERSION, built from commit $env:GITHUB_SHA.

          - **framework-dependent**: requires the .NET 10 runtime on the server.
          - **self-contained**: includes the .NET runtime.
          - Both include Chromium, the private Playwright driver, fonts, and a release manifest.
          - Both require the .NET 10 Hosting Bundle when hosted in IIS.

          Extract the complete ZIP. Configure API keys or anonymous access in an external JSON file as described in README.md. Verify downloads using the accompanying SHA-256 files.

          Both packages passed the build-machine PDF warm-up. Target-server IIS acceptance remains a deployment check; see docs/windows-acceptance.md in the package.
          "@
          $notesPath = Join-Path $env:RUNNER_TEMP 'pressroom-release-notes.md'
          Set-Content -LiteralPath $notesPath -Value $notes -Encoding utf8
          # Creating the ref is atomic: a concurrent tag creation fails instead of
          # letting gh attach these binaries to a different existing commit.
          $tagBody = @{ ref = "refs/tags/$tag"; sha = $env:GITHUB_SHA } | ConvertTo-Json
          Invoke-RestMethod -Method Post -Uri "$env:GITHUB_API_URL/repos/$env:GITHUB_REPOSITORY/git/refs" `
            -Headers $headers -ContentType 'application/json' -Body $tagBody | Out-Null
          $arguments = @('release', 'create', $tag) + $assets + @(
            '--repo', $env:GITHUB_REPOSITORY, '--verify-tag',
            '--title', "Pressroom $env:RELEASE_VERSION", '--notes-file', $notesPath, '--generate-notes'
          )
          if ($env:RELEASE_DRAFT -eq 'true') { $arguments += '--draft' }
          if ($env:RELEASE_PRERELEASE -eq 'true' -or $env:RELEASE_VERSION.Contains('-')) { $arguments += '--prerelease' }
          gh @arguments
          if ($LASTEXITCODE -ne 0) { throw 'GitHub release creation failed. The verified assets remain in this workflow run.' }
          "Created release $tag from commit $env:GITHUB_SHA with both Windows packages and SHA-256 files." >> $env:GITHUB_STEP_SUMMARY
