name: Release
run-name: Release v${{ inputs.version }} from ${{ github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version without v (for example, 1.2.3 or 1.2.3-rc.1)'
        required: true
        type: string
      draft:
        description: Save as a draft instead of publishing immediately
        type: boolean
        default: false
      publish_nuget:
        description: Publish client packages to nuget.org after the server release
        type: boolean
        default: false
      prerelease:
        description: Mark as a prerelease (automatic for versions with a suffix)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

env:
  RELEASE_VERSION: ${{ inputs.version }}

defaults:
  run:
    shell: pwsh

jobs:
  build:
    name: Test, package, and release Windows x64
    runs-on: windows-2025
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      # Cache only this workflow's dependencies, not the runner's preinstalled packages.
      NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
    steps:
      - name: Check out the selected commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate the version
        run: |
          $number = '(0|[1-9][0-9]*)'
          $identifier = '(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)'
          $pattern = "\A$number\.$number\.$number(?:-$identifier(?:\.$identifier)*)?\z"
          if ($env:RELEASE_VERSION -cnotmatch $pattern) {
            throw 'Use a version such as 1.2.3 or 1.2.3-rc.1, without a v prefix or build metadata.'
          }
          foreach ($part in ($env:RELEASE_VERSION.Split('-')[0].Split('.'))) {
            if ([long]$part -gt 65534) { throw 'Version components must be at most 65534 for .NET assembly versions.' }
          }
          $existingTag = git tag --list "v$env:RELEASE_VERSION"
          if ($LASTEXITCODE -ne 0) { throw 'Could not inspect repository tags.' }
          if ($existingTag) { throw 'This version already has a tag. Choose a new release version.' }

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.x
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            src/**/packages.lock.json
            tests/**/packages.lock.json

      - name: Restore locked dependencies
        run: dotnet restore Pressroom.slnx --locked-mode "-p:Version=$env:RELEASE_VERSION" -p:DisableImplicitNuGetFallbackFolder=true

      - name: Build
        run: dotnet build Pressroom.slnx -c Release --no-restore "-p:Version=$env:RELEASE_VERSION" -p:ContinuousIntegrationBuild=true

      - name: Run tests
        run: dotnet test --solution Pressroom.slnx -c Release --no-build --no-restore

      - name: Publish and verify the framework-dependent package
        run: |
          dotnet publish src/Pressroom.Server/Pressroom.Server.csproj -c Release --no-restore `
            -p:PublishProfile=IisFolder "-p:Version=$env:RELEASE_VERSION" `
            -p:ContinuousIntegrationBuild=true
          if ($LASTEXITCODE -ne 0) { throw 'Publish failed for IisFolder.' }
          ./build/Package-Pressroom.ps1 -PublishDirectory artifacts/publish/IisFolder `
            -OutputDirectory artifacts/release -Version $env:RELEASE_VERSION -Variant framework-dependent

      - name: Preserve release assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-packages
          path: artifacts/release/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
          overwrite: true

      - name: Test the packaged Windows browser
        env:
          PRESSROOM_RUN_BROWSER_TESTS: '1'
          PRESSROOM_TEST_SANDBOX: 'true'
          PRESSROOM_TEST_BROWSERS_PATH: ${{ github.workspace }}/artifacts/publish/IisFolder/browsers
        run: |
          dotnet test --project tests/Pressroom.Rendering.Tests -c Release --no-build --no-restore
          if ($LASTEXITCODE -ne 0) { throw 'Windows browser tests failed.' }
          dotnet test --project tests/Pressroom.Server.Tests -c Release --no-build --no-restore
          if ($LASTEXITCODE -ne 0) { throw 'Windows jobs browser tests failed.' }

      # Use the verified local files directly; transferring them to a second
      # runner can take much longer than building and packaging the application.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_DRAFT: ${{ inputs.draft }}
          RELEASE_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          $tag = "v$env:RELEASE_VERSION"
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github+json' }
          # Recheck immediately before publishing; never reuse or move an existing tag/release.
          foreach ($resource in @("git/ref/tags/$tag", "releases/tags/$tag")) {
            $response = Invoke-WebRequest -Uri "$env:GITHUB_API_URL/repos/$env:GITHUB_REPOSITORY/$resource" `
              -Headers $headers -SkipHttpErrorCheck
            if ($response.StatusCode -ne 404) {
              throw "Expected an unused release version; GitHub returned HTTP $($response.StatusCode) for $resource."
            }
          }

          $name = "Pressroom-$env:RELEASE_VERSION-win-x64-framework-dependent.zip"
          $archive = Join-Path artifacts/release $name
          $checksum = $archive + '.sha256'
          $expected = (Get-Content -LiteralPath $checksum -Raw).Trim()
          $actual = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($expected -cne "$actual  $name") { throw "Checksum mismatch for $name." }
          $assets = @($archive, $checksum)

          $notes = @"
          Windows x64 framework-dependent package for Pressroom $env:RELEASE_VERSION, built from commit $env:GITHUB_SHA.

          - Requires the .NET 10 runtime on the server.
          - Includes Chromium, the private Playwright driver, fonts, and a release manifest.
          - Requires the .NET 10 Hosting Bundle when hosted in IIS.

          Extract the complete ZIP. Configure API keys or anonymous access in an external JSON file as described in docs/getting-started.md and docs/configuration.md in the package. Verify the download using the accompanying SHA-256 file.

          The package passed the build-machine PDF warm-up. Target-server IIS acceptance remains a deployment check; see docs/windows-acceptance.md in the package.
          "@
          $notesPath = Join-Path $env:RUNNER_TEMP 'pressroom-release-notes.md'
          Set-Content -LiteralPath $notesPath -Value $notes -Encoding utf8
          # Creating the ref is atomic: a concurrent tag creation fails instead of
          # letting gh attach these binaries to a different existing commit.
          $tagBody = @{ ref = "refs/tags/$tag"; sha = $env:GITHUB_SHA } | ConvertTo-Json
          Invoke-RestMethod -Method Post -Uri "$env:GITHUB_API_URL/repos/$env:GITHUB_REPOSITORY/git/refs" `
            -Headers $headers -ContentType 'application/json' -Body $tagBody | Out-Null
          $arguments = @('release', 'create', $tag) + $assets + @(
            '--repo', $env:GITHUB_REPOSITORY, '--verify-tag',
            '--title', "Pressroom $env:RELEASE_VERSION", '--notes-file', $notesPath, '--generate-notes'
          )
          if ($env:RELEASE_DRAFT -eq 'true') { $arguments += '--draft' }
          if ($env:RELEASE_PRERELEASE -eq 'true' -or $env:RELEASE_VERSION.Contains('-')) { $arguments += '--prerelease' }
          gh @arguments
          if ($LASTEXITCODE -ne 0) { throw 'GitHub release creation failed. The verified assets remain in this workflow run.' }
          "Created release $tag from commit $env:GITHUB_SHA with the framework-dependent Windows package and SHA-256 file." >> $env:GITHUB_STEP_SUMMARY

  publish-packages:
    name: Package and publish the .NET client
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          dotnet-version: 8.0.x
      - name: Restore, build, and test both client targets
        run: |
          dotnet restore tests/Pressroom.Contracts.Tests --locked-mode "-p:Version=$env:RELEASE_VERSION"
          if ($LASTEXITCODE -ne 0) { throw 'Client restore failed.' }
          dotnet build tests/Pressroom.Contracts.Tests -c Release --no-restore "-p:Version=$env:RELEASE_VERSION" -p:ContinuousIntegrationBuild=true
          if ($LASTEXITCODE -ne 0) { throw 'Client build failed.' }
          dotnet test --project tests/Pressroom.Contracts.Tests -c Release --no-build --no-restore
          if ($LASTEXITCODE -ne 0) { throw 'Client tests failed.' }
      - name: Pack
        run: |
          foreach ($project in @('Pressroom.Contracts', 'Pressroom.Client')) {
            dotnet pack "src/$project" -c Release --no-build --no-restore -o artifacts/nuget "-p:Version=$env:RELEASE_VERSION" -p:ContinuousIntegrationBuild=true
            if ($LASTEXITCODE -ne 0) { throw "Pack failed for $project." }
          }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nuget-packages
          path: artifacts/nuget/*
          if-no-files-found: error
      - name: Authenticate to nuget.org
        if: ${{ inputs.publish_nuget && !inputs.draft }}
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        id: nuget
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: Publish packages and symbols
        if: ${{ inputs.publish_nuget && !inputs.draft }}
        env:
          NUGET_API_KEY: ${{ steps.nuget.outputs.NUGET_API_KEY }}
        run: |
          foreach ($project in @('Pressroom.Contracts', 'Pressroom.Client')) {
            dotnet nuget push "artifacts/nuget/$project.$env:RELEASE_VERSION.nupkg" --api-key $env:NUGET_API_KEY --source https://api.nuget.org/v3/index.json --skip-duplicate
            if ($LASTEXITCODE -ne 0) { throw "NuGet publication failed for $project." }
          }

  container:
    name: Verify Linux and release the container
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare optional isolation on this disposable test host
        shell: bash
        run: |
          docker network create --driver bridge --opt com.docker.network.bridge.name=pressroom0 --opt com.docker.network.bridge.enable_icc=false pressroom-egress-blocked
          sudo iptables -I DOCKER-USER 1 -i pressroom0 -m conntrack ! --ctstate ESTABLISHED,RELATED -j DROP
          sudo iptables -I INPUT 1 -i pressroom0 -m conntrack ! --ctstate ESTABLISHED,RELATED -j DROP
          sudo ip6tables -I FORWARD 1 -i pressroom0 -m conntrack ! --ctstate ESTABLISHED,RELATED -j DROP
          sudo ip6tables -I INPUT 1 -i pressroom0 -m conntrack ! --ctstate ESTABLISHED,RELATED -j DROP
      - name: Build and verify as an unprivileged user
        # The runtime smoke check uses the same outbound firewall as deployment.
        # The builder itself needs network access to restore pinned dependencies.
        run: |
          ./build/Build-Container.ps1 -Version $env:RELEASE_VERSION -Image "ghcr.io/auroris/pressroom:$env:RELEASE_VERSION" -TestNetworkIsolation
      - name: Package the verified Linux folder
        run: |
          ./build/Package-Pressroom.ps1 -PublishDirectory artifacts/container-publish -OutputDirectory artifacts/linux-release -Version $env:RELEASE_VERSION -Variant framework-dependent -RuntimeIdentifier linux-x64
      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ghcr.io/auroris/pressroom:${{ inputs.version }}
          format: spdx-json
          output-file: artifacts/linux-release/pressroom.spdx.json
          upload-release-assets: false
      - name: Reject critical vulnerabilities
        uses: aquasecurity/trivy-action@8f28faec26515256b6d22074d1d2a8986f4cbd87
        with:
          image-ref: ghcr.io/auroris/pressroom:${{ inputs.version }}
          severity: CRITICAL
          exit-code: '1'
          format: table
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-release
          path: artifacts/linux-release/*
          if-no-files-found: error
      - name: Attach Linux artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "v$env:RELEASE_VERSION" (Get-ChildItem artifacts/linux-release -File).FullName --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) { throw 'Linux release upload failed.' }
      - name: Push verified image
        if: ${{ !inputs.draft }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          $env:GH_TOKEN | docker login ghcr.io -u $env:GITHUB_ACTOR --password-stdin
          if ($LASTEXITCODE -ne 0) { throw 'Registry login failed.' }
          $image = "ghcr.io/auroris/pressroom:$env:RELEASE_VERSION"
          docker push $image
          if ($LASTEXITCODE -ne 0) { throw 'Image push failed.' }
          if (!$env:RELEASE_VERSION.Contains('-') -and $env:RELEASE_PRERELEASE -ne 'true') {
            docker tag $image ghcr.io/auroris/pressroom:latest
            docker push ghcr.io/auroris/pressroom:latest
            if ($LASTEXITCODE -ne 0) { throw 'Latest tag push failed.' }
          }
          $digest = docker image inspect $image --format '{{index .RepoDigests 0}}'
          $size = docker image inspect $image --format '{{.Size}}'
          $notes = gh release view "v$env:RELEASE_VERSION" --repo $env:GITHUB_REPOSITORY --json body --jq .body
          if ($LASTEXITCODE -ne 0) { throw 'Could not read release notes.' }
          $notesPath = Join-Path $env:RUNNER_TEMP container-notes.md
          $build = Get-Content artifacts/container-build.json -Raw | ConvertFrom-Json
          ($notes -join "`n") + "`n`nContainer: $digest`nRuntime base: $($build.runtimeBase) (pulled for this build)`nPlaywright: $($build.playwrightVersion); Chromium: $($build.chromiumVersion)`nDocker-reported image size: $size bytes. SBOM attached; critical CVE gate passed.`n" | Set-Content $notesPath
          gh release edit "v$env:RELEASE_VERSION" --repo $env:GITHUB_REPOSITORY --notes-file $notesPath
          if ($LASTEXITCODE -ne 0) { throw 'Could not record the image digest.' }
